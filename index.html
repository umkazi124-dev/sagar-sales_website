<style>
  :root {
    --bg: #101214;
    --gold: #f7cb4d;
    --gold-soft: #eedca5;
    --text: #f3ecd6;
    --muted: #8f8b7e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    min-height: 100svh;
    background: var(--bg);
    color: var(--text);
    font-family: "Jost", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* Background: auto parts line art, faded out behind the content */
  .parts {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.4;
    stroke-linejoin: round;
    stroke-linecap: round;
    opacity: .3;
    pointer-events: none;
  }
  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 62% at 50% 46%, rgba(16,18,20,.94) 0%, rgba(16,18,20,.7) 55%, rgba(16,18,20,0) 100%),
      radial-gradient(ellipse 80% 40% at 50% 110%, rgba(247,203,77,.10), transparent 70%);
  }

  main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 16px 24px;
  }
  .logo {
    width: min(64vw, 300px);
    height: auto;
    display: block;
  }
  h1 {
    margin-top: 12px;
    font-weight: 500;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    letter-spacing: .05em;
    line-height: 1.1;
    color: var(--text);
  }
  h1 span {
    display: block;
    margin-top: 10px;
    font-weight: 300;
    font-size: clamp(1.05rem, 2.8vw, 1.5rem);
    letter-spacing: .2em;
    color: var(--gold);
  }
  .rule {
    width: 64px;
    height: 2px;
    margin: 30px auto;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    border-radius: 2px;
  }
  .call {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 15px 30px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    color: #17140a;
    font-weight: 500;
    font-size: 1.2rem;
    letter-spacing: .06em;
    text-decoration: none;
    box-shadow: 0 10px 30px -10px rgba(247,203,77,.55);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .call:hover { transform: translateY(-2px); box-shadow: 0 14px 34px -10px rgba(247,203,77,.7); }
  .call:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
  .call svg { width: 22px; height: 22px; flex: none; fill: currentColor; }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 18px 16px 24px;
    font-size: .85rem;
    letter-spacing: .04em;
    color: var(--muted);
  }

  /* One page-load reveal for the whole block */
  main > * { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  main > .logo { animation-delay: .05s; }
  main > h1 { animation-delay: .25s; }
  main > .rule { animation-delay: .4s; }
  main > .call { animation-delay: .5s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    main > * { animation: none; }
    .call { transition: none; }
  }
</style>
</head>
